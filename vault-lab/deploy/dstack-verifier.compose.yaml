# Local negative-control probe only; no app secrets, host mounts or wallet access.
# Release: verifier-v0.5.11. The release-published digest is pinned, not a mutable tag.
# The small tmpfs deliberately does not provision storage for arbitrary OS images.
services:
  verifier:
    image: docker.io/dstacktee/dstack-verifier@sha256:a000adea64ba689c8949647bfaa034e56b3e1f537ddf6ae97182abb95e7f560d
    ports:
      - "127.0.0.1:4811:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,size=268435456
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    restart: "no"
