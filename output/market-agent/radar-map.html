  <script>
    (()=>{
      const root=document.getElementById('early-meme-radar'),data=JSON.parse(root.querySelector('#early-radar-data').textContent);
      const nav=root.querySelector('.story-nav'),diagram=root.querySelector('.diagram'),branches=root.querySelector('.branches'),source=root.querySelector('.story-root'),detail=root.querySelector('.idea-detail');
      const labels={EXPLORE:'Explorar',REWORK:'Reformular',PASS:'Descartar'},angles={association:'Asociación',character:'Personaje',mechanic:'Mecánica',cultural:'Lectura cultural'};
      const make=(tag,cls,text,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e;};
      let story=data.stories.find(s=>s.id===data.selectedStoryId)??data.stories[0],selectedId=null;
      const date=value=>value?new Date(value).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' ART':'Sin registro';
      root.querySelector('.cut').textContent='Propuestas: '+date(data.generatedAt)+' · evidencia inicial: '+date(data.sourceObservedAt)+(data.followup?' · seguimiento: '+date(data.followup.observedAt):'');
      function draw(){
        const box=diagram.getBoundingClientRect(),a=source.getBoundingClientRect(),svg=root.querySelector('.fan-lines');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
        for(const b of branches.querySelectorAll('button')){const r=b.getBoundingClientRect(),stacked=r.left<a.right-5;let path;
          if(stacked){const x=12,y=a.bottom-box.top,x2=r.left-box.left,y2=r.top-box.top+r.height/2;path=`M${x},${y} L${x},${y2} L${x2},${y2}`;}
          else{const x=a.right-box.left,y=a.top-box.top+a.height/2,x2=r.left-box.left,y2=r.top-box.top+r.height/2;path=`M${x},${y} C${(x+x2)/2},${y} ${(x+x2)/2},${y2} ${x2},${y2}`;}
          const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);p.dataset.selected=String(b.dataset.id===selectedId);svg.append(p);
        }
      }
      function block(title,text,parent=detail){if(!text)return;const b=make('div','detail-block',undefined,parent);make('h4','',title,b);make('p','',text,b);return b;}
      function links(evidence,parent){if(!evidence?.length)return;const b=make('div','detail-block',undefined,parent);make('h4','','Evidencia',b);for(const e of evidence){if(!e.url){make('p','',e.label,b);continue;}const a=make('a','',e.label+' ↗',b);a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';}}
      function latest(){const review=data.followup?.summaries.find(item=>item.storyId===story.id);if(!review)return;const more=make('details','',undefined,detail);make('summary','','Última lectura · '+review.verdict,more);block('Qué cambió · '+date(data.followup.observedAt),review.text,more);links(review.sources,more);}
      function select(id){
        selectedId=id;detail.replaceChildren();for(const b of branches.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===id));
        const idea=story.interpretations.find(i=>i.id===id);
        if(!idea){make('div','eyebrow',story.mode==='retrospective'?'Caso retrospectivo':'Hecho / fuente',detail);make('h3','',story.title,detail);block('Qué sabemos',story.summary);block('Expresión cultural observada',story.meme);block('Brecha por comprobar',story.gap);block('Timing y límites',story.timingNote);links(story.evidence,detail);latest();draw();return;}
        make('div','eyebrow',angles[idea.angle],detail);make('h3','',idea.title,detail);
        make('p','decision',labels[idea.decision.status]+' · '+idea.decisionReason,detail);
        block('Qué lanzamos',idea.pitch);block('Qué hace',idea.whatItDoes);block('Por qué podría prender',idea.whyNow);block('Qué aporta',idea.distinctiveElement);
        block('Primer chequeo',idea.quickCheck);
        latest();
        const more=make('details','',undefined,detail);make('summary','','Construcción, competencia y fuentes',more);
        block('Versión mínima',idea.minimumBuild,more);block('Esfuerzo estimado',idea.buildLabel+' · estimación preliminar',more);
        block('Competencia',idea.competitionNote,more);block('Cuándo descartarla',idea.discardIf,more);block('Límites de la evaluación',idea.decision.reason,more);links(idea.evidence,more);
        if(idea.marketEvidence?.length)links(idea.marketEvidence,more);
        if(window.openai?.sendFollowUpMessage){const b=make('button','next-step','Desarrollar esta interpretación',detail);b.type='button';b.addEventListener('click',async()=>{b.disabled=true;try{await window.openai.sendFollowUpMessage({title:'Desarrollar idea',prompt:`Desarrollá la interpretación ${idea.title} del caso ${story.title}. Tesis: ${idea.pitch} Comportamiento: ${idea.whatItDoes} Verificá primero fuentes actuales, la relación cultural, competencia exacta y cuánto margen temporal sigue abierto. Compará con otra interpretación y prepará un concepto local con nombre, visual y comportamiento realizable. Conservá fecha de esta propuesta ${data.generatedAt}. No publiques ni conectes wallets, firmes o lances. Fuentes iniciales: ${idea.evidence.map(e=>e.url).join(' ')}`});}finally{b.disabled=false;}});}
        draw();
      }
      function showStory(id){
        story=data.stories.find(s=>s.id===id);for(const b of nav.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.id===id));
        root.querySelector('.story-mode').textContent=story.stageLabel??(story.mode==='retrospective'?'Reconstrucción · no acredita anticipación':'Ideas sobre una captura con fecha');
        root.querySelector('.branch-count').textContent=story.interpretations.length+' interpretaciones';source.replaceChildren();make('div','eyebrow','Idea / noticia',source);make('strong','',story.title,source);make('small','',story.rootNote,source);
        source.onclick=()=>select(null);branches.replaceChildren();
        for(const idea of story.interpretations){const b=make('button','idea-node',undefined,branches);b.type='button';b.dataset.id=idea.id;b.setAttribute('aria-pressed','false');const meta=make('div','idea-meta',undefined,b);make('span','',angles[idea.angle],meta);const status=make('span','idea-status',labels[idea.decision.status],meta);status.dataset.status=idea.decision.status;make('strong','',idea.title,b);make('p','',idea.pitch,b);b.addEventListener('click',()=>select(idea.id));}
        const clocks=root.querySelector('.clock-row');clocks.replaceChildren();for(const [label,value] of [['Noticia publicada',story.publishedAt],['Primera detección documentada',story.firstSeenAt],['Primer lanzamiento confirmado',story.firstLaunchAt]]){const c=make('div','',undefined,clocks);make('span','',label,c);make('b','',!value&&label==='Noticia publicada'&&story.publishedDate?story.publishedDate+' · hora desconocida':date(value),c);}
        root.querySelector('.timing-note').textContent=story.timingNote+(story.firstMarketObservedAt?' Captura de mercado: '+date(story.firstMarketObservedAt)+'.':'');
        select((story.interpretations.find(i=>i.decision.status==='EXPLORE')??story.interpretations[0]).id);requestAnimationFrame(draw);
      }
      for(const s of data.stories){const b=make('button','',s.shortTitle,nav);b.type='button';b.dataset.id=s.id;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>showStory(s.id));}
      showStory(story.id);new ResizeObserver(draw).observe(diagram);
    })();
  </script>
